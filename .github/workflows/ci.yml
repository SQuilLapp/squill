name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Squill.slnx -c Release -warnaserror
      - run: dotnet build Squill.Windows.slnx -c Release -warnaserror
      - run: dotnet test --solution Squill.slnx -c Release
      - run: dotnet publish tools/Squill.TokenGen -c Release -r win-x64

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build Squill.slnx -c Release -warnaserror
      - run: dotnet test --solution Squill.slnx -c Release
      - name: Pull the container images
        run: |
          docker pull postgres:17-alpine
          docker pull mysql:8.4
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker pull lscr.io/linuxserver/openssh-server:latest
      - name: Docker-gated driver tests
        env:
          SQUILL_DOCKER_TESTS: 1
        run: |
          dotnet test --project tests/Squill.Data.Postgres.Tests -c Release
          dotnet test --project tests/Squill.Data.MySql.Tests -c Release
          dotnet test --project tests/Squill.Data.SqlServer.Tests -c Release
          dotnet test --project tests/Squill.Platform.Tests -c Release --filter-class '*SshJumpHostTests'
          dotnet test --project tests/Squill.Presentation.Tests -c Release --filter-class '*SshSessionTests'
      - run: dotnet publish tools/Squill.TokenGen -c Release -r linux-x64
