name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Squill.slnx -c Release -warnaserror
      - run: dotnet build Squill.Windows.slnx -c Release -warnaserror
      - run: dotnet test --solution Squill.slnx -c Release
      - run: dotnet publish tools/Squill.TokenGen -c Release -r win-x64

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Squill.slnx -c Release -warnaserror
      - run: dotnet test --solution Squill.slnx -c Release
      - run: dotnet publish tools/Squill.TokenGen -c Release -r linux-x64
